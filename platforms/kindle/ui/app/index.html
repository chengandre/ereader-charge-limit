<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Charge Limit</title>
    <!-- Sized to the screen width so the page fits one screen: Mesquite
         barely scrolls. -->
    <script>document.documentElement.style.fontSize = (window.innerWidth || 1072) / 42 + "px";</script>
    <style>
        body { font-family: sans-serif; margin: 0.8rem 1.2rem; background: #fff; color: #000; }
        h1 { font-size: 1.4rem; margin: 0 0 0.6rem 0; }
        h2 { font-size: 1rem; margin: 0 0 0.3rem 0; }
        /* Text, not a button: grey and borderless. */
        .info { font-size: 1rem; line-height: 1.35; background: #e4e4e4; padding: 0.6rem 0.8rem;
                margin: 0 0 0.8rem 0; white-space: pre-wrap; }
        button { display: block; width: 100%; font-size: 1.1rem; padding: 0.6rem; margin: 0 0 0.5rem 0;
                 background: #fff; color: #000; border: 2px solid #000; }
        button.secondary { font-size: 1rem; padding: 0.45rem; border-width: 1px; }
        button:disabled { color: #888; border-color: #aaa; }
        /* Fixed table cells share the available width without wrapping on Mesquite. */
        .choices { display: table; table-layout: fixed; width: 100%; }
        .choices > div { display: table-cell; vertical-align: top; }
        .choices .choice-gap { width: 2%; }
        .choices button { -webkit-box-sizing: border-box; box-sizing: border-box; -webkit-appearance: none; }
        .choices button[aria-pressed="true"] { background: #000; color: #fff; }
        .gap { height: 0.5rem; }
        .small { font-size: 0.8rem; color: #444; margin: 0.6rem 0 0 0; }
    </style>
</head>
<body>
    <h1>Charge Limit</h1>
    <button id="install" disabled>Checking...</button>
    <div id="info" class="info">Loading...</div>

    <h2 id="limit-heading">Charge Limit</h2>
    <div id="limit-options" class="choices" role="group" aria-labelledby="limit-heading">
        <div><button data-action="limit-off" aria-pressed="false" disabled>Off</button></div>
        <div class="choice-gap" aria-hidden="true"></div>
        <div><button data-action="limit-70" aria-pressed="false" disabled>70%</button></div>
        <div class="choice-gap" aria-hidden="true"></div>
        <div><button data-action="limit-80" aria-pressed="false" disabled>80%</button></div>
        <div class="choice-gap" aria-hidden="true"></div>
        <div><button data-action="limit-90" aria-pressed="false" disabled>90%</button></div>
    </div>

    <h2 id="restart-heading">Charge limit at startup</h2>
    <div id="restart-options" class="choices" role="group" aria-labelledby="restart-heading">
        <div><button data-action="start-on" aria-pressed="false" disabled>On</button></div>
        <div class="choice-gap" aria-hidden="true"></div>
        <div><button data-action="start-off" aria-pressed="false" disabled>Off</button></div>
    </div>
    <button data-action="full" disabled>Full charge once</button>
    <div class="gap"></div>
    <button class="secondary" data-action="activity" disabled>Charge activity</button>
    <button class="secondary" data-action="diagnose" disabled>Charge diagnostics</button>
    <button class="secondary" id="uninstall" disabled>Uninstall Charge Limit</button>

    <p class="small" id="version"></p>

    <!-- bridge.js (BRIDGE, TOKEN) is written by open-app.sh. -->
    <script src="bridge.js"></script>
    <script src="app.js"></script>
</body>
</html>
